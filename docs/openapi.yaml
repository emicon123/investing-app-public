            Up to app.news.history-lookback-days (default 7) days of this asset's own past news, most-recent-first — added ADR-079 so the nightly research prompt can tell "already reported, no update" from "genuinely new development" instead of starting cold every night. Empty array when the asset has no history in the window.
          items:
