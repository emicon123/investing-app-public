      operationId: refreshFxRates
      security:
        - bearerAuth: []
      description: |
        Force-refreshes every tracked PLN FX rate (EUR, USD, CHF, GBP) from Yahoo
        Finance, bypassing the cache TTL. Returns 204 No Content with no body on
        success — callers that need the refreshed rates should follow up with
        `GET /market-data/fx-rates`.
      responses:
        '204':
          description: FX rates refreshed.
        '401':
