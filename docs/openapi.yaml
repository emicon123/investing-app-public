          schema:
            type: string
            enum:
              - BTC-USD
              - ^NDX
              - GC=F
              - ^HSI
          example: BTC-USD
      description: |
        Returns weekly closes (Yahoo v8 chart API, interval 1wk, explicit period1/period2 —
        never the range=max shorthand, which silently degrades a long-history request to
        coarser, irregularly-spaced candles) windowed to the blend chart's 2011-07 start
        (the ADR-069 backtest window). Server-cached for 12h — this endpoint is a
        read-only overlay for the Settings blend-factor history chart (ADR-070), not a
        live quote feed. The frontend plots the raw close on a dedicated right-hand
        log-scale axis (domain padded ±5% multiplicatively from the visible window's
        min/max), carrying the latest close forward for every blend-history row so the
        overlay line renders solid instead of breaking at gaps.
      responses:
        '200':
          description: Daily benchmark closes, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkHistoryListResponse'
