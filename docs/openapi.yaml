          description: All persisted macro_state rows, ordered by asOfDate ascending.
          items:
            $ref: '#/components/schemas/MacroStateHistoryPoint'
        meta:
          $ref: '#/components/schemas/Meta'
    PriceSource:
      type: string
      enum:
        - YAHOO
        - RECONSTRUCTED_PRECISE
        - RECONSTRUCTED_APPROXIMATE
      description: |
        Provenance of a historical price point (ADR-085). YAHOO = returned directly by Yahoo Finance's v8 chart API — the default for every ticker. RECONSTRUCTED_PRECISE = Yahoo returned no usable history and the point was reconstructed from a physically-backed ETP's disclosed coin-entitlement ratio decaying at a fixed, disclosed fee rate with no staking variable in play (ETNVIRBTCP.WA, ETNVIRXRP.WA) — high confidence. RECONSTRUCTED_APPROXIMATE = same reconstruction, but additionally netted against a disclosed staking-yield figure held constant over the reconstructed window (ETNVIRETH.WA, ETNVIRSOL.WA) — meaningfully wider error bars; see ADR-085 §4/§8 for why.
    BenchmarkHistoryPoint:
      type: object
      required:
        - symbol
        - date
        - close
      properties:
        symbol:
          type: string
          example: BTC-USD
        date:
          type: string
          format: date
          example: '2011-07-01'
        close:
          type: number
          format: double
          description: Raw weekly close; the frontend plots it directly on a log-scale right-hand axis (not normalized).
        priceSource:
          $ref: '#/components/schemas/PriceSource'
          description: |
            Absent/omitted is equivalent to YAHOO (ADR-085). Only ever non-YAHOO if a Virtune ETP ticker is ever added to this overlay's fixed symbol set — not the case for the four benchmarks currently wired in (BTC-USD, ^NDX, GC=F, ^HSI).
    BenchmarkHistoryListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkHistoryPoint'
        meta:
          $ref: '#/components/schemas/Meta'
  responses:
    UnprocessableEntity:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid Authorization token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: UNAUTHORIZED
                message: Bearer token missing or invalid
            meta:
              requestId: 00000000-0000-0000-0000-000000000000
              timestamp: '2026-06-08T12:00:00Z'
    Forbidden:
      description: Authenticated but email not in allowlist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Duplicate resource (unique constraint violated).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: |
        Invalid request, for example a malformed `Idempotency-Key` header (`VALIDATION_ERROR`, `field: Idempotency-Key`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: VALIDATION_ERROR
                field: Idempotency-Key
                message: must be 1-255 printable ASCII characters
            meta:
              requestId: 00000000-0000-0000-0000-000000000000
              timestamp: '2026-11-04T12:00:00Z'
    IdempotencyInProgress:
      description: |
        A request with the same `Idempotency-Key` is still being processed, or it ended with a 5xx and its outcome is unknown (ADR-111). Nothing was written by this request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: IDEMPOTENCY_IN_PROGRESS
                message: A request with this Idempotency-Key is in progress or its outcome is unknown; check the history before retrying
            meta:
              requestId: 00000000-0000-0000-0000-000000000000
              timestamp: '2026-11-04T12:00:00Z'
    UnprocessableOrKeyReused:
      description: |
        Validation error (`VALIDATION_ERROR`), or the `Idempotency-Key` was already used for a different method, path or body (`IDEMPOTENCY_KEY_REUSED`, ADR-111).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: IDEMPOTENCY_KEY_REUSED
                message: Idempotency-Key was already used for a different request
            meta:
              requestId: 00000000-0000-0000-0000-000000000000
              timestamp: '2026-11-04T12:00:00Z'
    PushNotConfigured:
      description: |
        Web Push is not configured on this backend (VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT not all set — ADR-108 §7). Not retried by clients; the news script logs it and carries on.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: PUSH_NOT_CONFIGURED
                message: Web Push is not configured (VAPID keys missing)
            meta:
              requestId: 00000000-0000-0000-0000-000000000000
              timestamp: '2026-10-27T04:21:00Z'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key that makes this money-moving request safe to retry (ADR-111,
        IETF draft-ietf-httpapi-idempotency-key-header). The web client generates one random
        UUID per user intent (one dialog submission) and reuses it for every retry of that
        intent; it rotates the key after a success or when the dialog closes.

        - First request with a key: processed normally. A 2xx response is stored for 24 h.
        - Same key, same method + path + body, after a 2xx: the stored response is replayed
          (same status and body) with the response header `Idempotent-Replayed: true`; nothing
          is written again.
        - Same key while the first request is still running, or after it failed with a 5xx
          (outcome unknown): `409 IDEMPOTENCY_IN_PROGRESS`. Check the history before retrying
          with a new key.
        - Same key, different method, path or body: `422 IDEMPOTENCY_KEY_REUSED`.
        - A 4xx response is not stored (nothing was written), so a corrected retry with the
          same key runs normally.
        - Malformed key (empty, longer than 255 characters, or not printable ASCII): `400
          VALIDATION_ERROR` with `field: Idempotency-Key`.

        Omitting the header keeps the pre-ADR-111 behaviour (no deduplication).
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 6f1c2a8e-3b7d-4c55-9a0e-2f4b1d9c7e10
