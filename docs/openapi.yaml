        yearlySums:
          type: array
          description: |
            Per-year PLN sums over the WHOLE table (independent of the ?year filter), ordered by year descending — lets the UI render the year selector and the PIT-38 total from a single call.
          items:
            $ref: '#/components/schemas/BinanceTransferYearlySum'
