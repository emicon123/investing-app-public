    PriceRefreshResult:
      type: object
      description: |
        Raw result of a synchronous price refresh — NOT wrapped in the standard `{data, meta}` envelope. `POST /market-data/prices/refresh` returns this shape directly on the wire (`ResponseEntity<PriceRefreshResult>` in the Java controller), matching what `useRefreshPrices.ts` expects.
      required:
        - total
        - succeeded
        - failures
      properties:
        total:
          type: integer
          description: Total number of tickers a refresh was attempted for.
        succeeded:
          type: integer
          description: Number of tickers successfully refreshed.
        failures:
          type: array
          items:
            $ref: '#/components/schemas/TickerFailure'
    TickerFailure:
      type: object
      required:
        - ticker
        - reason
      properties:
        ticker:
          type: string
        reason:
          type: string
    RegressionDataPoint:
      type: object
      description: |
        One row of log-linear regression output (mirrors Java RegressionPointDto). Actual-price fields (close/high/low/logN/residual) are null for future extrapolated rows. Fixed 2026-09-15: the previous nested {prices,trendline,sdBands} shape never matched the implementation.
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
          description: 1-indexed position in the full fitted history (oldest = 1).
        close:
          type:
            - number
            - 'null'
          format: double
        high:
          type:
            - number
            - 'null'
          format: double
        low:
          type:
            - number
            - 'null'
          format: double
        logN:
          type:
            - number
            - 'null'
          format: double
          description: ln(close).
        trendline:
          type: number
          format: double
          description: exp(lnTrendline) — the trend value in price units.
        lnTrendline:
          type: number
          format: double
          description: intercept + slope * count.
        residual:
          type:
            - number
            - 'null'
          format: double
          description: logN - lnTrendline.
        sd1plus:
          type: number
          format: double
        sd2plus:
          type: number
          format: double
        sd1minus:
          type: number
          format: double
        sd2minus:
          type: number
          format: double
        sd3plus:
          type: number
          format: double
        sd3minus:
          type: number
          format: double
        sd4plus:
          type: number
          format: double
        sd4minus:
          type: number
          format: double
          description: trendline * exp(+4*sd); bands are trendline * exp(k*sd), k = ±1..±4.
    RegressionResponse:
      type: object
      description: |
        Flat shape mirroring Java LinearRegressionResponse (returned raw, NOT wrapped in a {data} envelope — meta rides inside the same object). Fixed 2026-09-15: the previous nested {data: {ticker,prices,trendline,sdBands}, meta} shape never matched the implementation (see LinearRegressionResponse.java javadoc).
      required:
        - ticker
        - interval
        - slope
        - intercept
        - stdDev
        - dataPoints
        - meta
      properties:
        ticker:
          type: string
        interval:
          type: string
          description: d | wk | mo (echo of the request param).
        slope:
          type: number
          format: double
          description: OLS slope of ln(close) over the 1-indexed full history.
        intercept:
          type: number
          format: double
        stdDev:
          type: number
          format: double
          description: Sample standard deviation (n-1) of the ln residuals.
        dataPoints:
          type: array
          items:
            $ref: '#/components/schemas/RegressionDataPoint'
        priceSource:
          $ref: '#/components/schemas/PriceSource'
          description: |
            One value for the whole response, not per-point (ADR-085 §8) — provenance of the price series this regression was fit against. trendline/bands are derived from it and have no independent source of their own. Absent/omitted is equivalent to YAHOO; only ever non-YAHOO for the four Virtune ETP tickers.
        meta:
          $ref: '#/components/schemas/Meta'
    TradeChartTickerEntry:
      type: object
      description: |
        One entry per ticker eligible for the trade-history chart's ticker picker. Built from DISTINCT asset_purchases.ticker (every ticker ever traded) joined to positions for display metadata.
      properties:
        ticker:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 200
        yahooTicker:
          type: string
        priceCurrency:
          $ref: '#/components/schemas/Currency'
        tradeCount:
          type: integer
          format: int64
          description: |
            Count of real trades for this ticker (excludes SEED_IMPORT rows — the synthetic 2024-01-01 migration backfill, not a real trade event). A ticker with only SEED_IMPORT rows still appears here with tradeCount 0 rather than being omitted.
        firstTradeAt:
          type: string
          format: date-time
        lastTradeAt:
          type: string
          format: date-time
    ExcludedTradeChartTicker:
      type: object
      description: A ticker with trade history that could not be resolved for charting, and why.
      required:
        - ticker
        - reason
      properties:
        ticker:
          type: string
          maxLength: 20
        reason:
          type: string
          enum:
            - NO_POSITION_MATCH
            - MISSING_YAHOO_TICKER
          description: |
            NO_POSITION_MATCH = no positions row has this ticker at all (e.g. the position was later renamed/removed). MISSING_YAHOO_TICKER = a matching positions row exists but its yahoo_ticker is NULL, so no price history can be fetched.
    TradeChartTickersResponse:
      type: object
      required:
        - data
        - excluded
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TradeChartTickerEntry'
        excluded:
          type: array
          items:
            $ref: '#/components/schemas/ExcludedTradeChartTicker'
          description: Tickers omitted from data, with a reason — never a silent drop.
        meta:
          $ref: '#/components/schemas/Meta'
    TradeChartPricePoint:
      type: object
      description: |
        One OHLC point of the raw price series (no regression fit). open/high/low back the frontend's optional candlestick rendering mode (ADR-057 addendum) — a same-day trade can look misaligned against a close-only line when it executed at a different point within that day's actual range; a candle makes the full range visible instead of just the close.
      properties:
        date:
          type: string
          format: date
        open:
          type: number
          format: double
        close:
          type: number
          format: double
        high:
          type: number
          format: double
        low:
          type: number
          format: double
        priceSource:
          $ref: '#/components/schemas/PriceSource'
          description: |
            Absent/omitted is equivalent to YAHOO. Only ever non-YAHOO for the four Virtune ETP tickers Yahoo has no history for (ADR-085) — every other ticker's points are always YAHOO.
    TradeChartMarker:
      type: object
      description: |
        One asset_purchases row rendered as a dot on the trade-history chart. unitsDelta's sign is the buy/sell indicator (positive=buy, negative=sell) — same convention as the asset_purchases column it is sourced from. Recommended frontend rendering: dot size scales with abs(totalPln); dot color/shade keys off tradeType (not enforced by this schema — a display concern).
      properties:
        id:
          type: integer
          format: int64
        purchasedAt:
          type: string
          format: date-time
        tradeType:
          $ref: '#/components/schemas/TradeType'
        portfolio:
          $ref: '#/components/schemas/Portfolio'
        accountType:
          $ref: '#/components/schemas/AccountType'
        unitsDelta:
          type: number
          format: double
        pricePln:
          type: number
          format: double
        priceNative:
          type: number
          format: double
          description: |
            pricePln converted to the position's priceCurrency via a nearest-date historical FX lookup (ADR-057). Equal to pricePln when priceCurrency is PLN. This is the Y-axis value the marker should be plotted at — it matches the units of priceSeries below.
        totalPln:
          type: number
          format: double
          description: Signed — negative for sells, matching asset_purchases.total_pln.
        sessionId:
          type:
            - integer
            - 'null'
          format: int64
    TradeChartResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: object
          properties:
            ticker:
              type: string
            yahooTicker:
              type: string
            priceCurrency:
              $ref: '#/components/schemas/Currency'
            interval:
              type: string
            priceSeries:
