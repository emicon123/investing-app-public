      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

tradeClose:
  patch:
    tags: [bot]
    summary: Close a trade (machine-only; never kill-switch-gated)
    operationId: closeBotTrade
    security:
      - serviceTokenAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/bot.yaml#/CloseBotTradeRequest"
    responses:
      "200":
        description: Closed trade.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bot.yaml#/BotTradeSingleResponse"
      "401":
        description: Missing or invalid X-Service-Token header.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/ErrorResponse"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "422":
        $ref: "../components/responses.yaml#/UnprocessableEntity"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

tradeActions:
  post:
    tags: [bot]
    summary: Append a management action to a trade (machine-only)
    operationId: addBotTradeAction
    security:
      - serviceTokenAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/bot.yaml#/CreateBotTradeActionRequest"
    responses:
      "201":
        description: Stored action (the durable audit row).
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bot.yaml#/BotTradeActionSingleResponse"
      "401":
        description: Missing or invalid X-Service-Token header.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/ErrorResponse"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "422":
        $ref: "../components/responses.yaml#/UnprocessableEntity"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
  get:
    tags: [bot]
    summary: Action timeline of a trade, oldest first (dual-audience read)
    operationId: listBotTradeActions
    security:
      - bearerAuth: []
      - serviceTokenAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: Actions, createdAt ASC.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bot.yaml#/BotTradeActionListResponse"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

tradeTicks:
  post:
    tags: [bot]
    summary: Append 5s scalp ticks to a trade (machine-only)
    operationId: addBotTradeTicks
    security:
      - serviceTokenAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/bot.yaml#/CreateBotTradeTicksRequest"
    responses:
      "201":
        description: Stored ticks (empty batch → empty list, still 201).
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bot.yaml#/BotTradeTickListResponse"
      "401":
        description: Missing or invalid X-Service-Token header.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/ErrorResponse"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "422":
        $ref: "../components/responses.yaml#/UnprocessableEntity"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
  get:
    tags: [bot]
    summary: Ticks of a trade, oldest first (dual-audience read)
    operationId: listBotTradeTicks
    security:
      - bearerAuth: []
      - serviceTokenAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
    responses:
      "200":
        description: Ticks, createdAt ASC (range applies only when both from+to present).
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bot.yaml#/BotTradeTickListResponse"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

tradeRequestManage:
  post:
    tags: [bot]
    summary: Acknowledge a strategist-call trigger (machine-only, no-op stub)
    operationId: requestBotTradeManage
    description: |
      Stateless 202 acknowledge today — no DB write, no queue. Contract kept so a
      future queued executor can slot in without a wire change.
    security:
      - serviceTokenAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "202":
        description: Accepted.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bot.yaml#/BotManageAckResponse"
      "401":
        description: Missing or invalid X-Service-Token header.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/ErrorResponse"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

pendingScalp:
  get:
    tags: [bot]
    summary: Post-trade outbox poll, oldest first (dual-audience read)
    operationId: listPendingScalpTrades
    description: |
      Rows with scalp_session_status=PENDING. Intentionally ignores trading_enabled
      (manages an already-open position). Non-paged envelope despite page/size absence.
      The host scalp launcher calls it with X-Service-Token; like every GET under
      /bot/trades/** (ADR-089) it also accepts the backend JWT. Task 191 derives each
      route's credential from this `security` list, so it must match the served behaviour.
    security:
      - bearerAuth: []
      - serviceTokenAuth: []
    responses:
      "200":
        description: Pending rows.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bot.yaml#/BotTradeListResponse"
      "401":
        description: Neither a valid bearer JWT nor a valid X-Service-Token header.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/ErrorResponse"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

scalpClaim:
  post:
    tags: [bot]
    summary: Atomically claim a PENDING scalp row (machine-only)
    operationId: claimScalpSession
    description: |
      Single-statement PENDING→RUNNING + SYSTEM/SCALP_SESSION_STARTED action row.
      200 = claimed; 409 = someone else won (not an error to the launcher).
      RUNNING-stuck rows are never auto-reclaimed (fail-closed).
    security:
      - serviceTokenAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      "200":
        description: Claimed trade.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bot.yaml#/BotTradeSingleResponse"
      "401":
        description: Missing or invalid X-Service-Token header.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/ErrorResponse"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

scalpFinish:
  post:
    tags: [bot]
    summary: Finish a RUNNING scalp row (machine-only)
    operationId: finishScalpSession
    security:
      - serviceTokenAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "../components/schemas/bot.yaml#/ScalpFinishRequest"
    responses:
      "200":
        description: Finished trade (SYSTEM/SCALP_SESSION_FINISHED row recorded).
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bot.yaml#/BotTradeSingleResponse"
      "401":
        description: Missing or invalid X-Service-Token header.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/ErrorResponse"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "409":
        $ref: "../components/responses.yaml#/Conflict"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

stats:
  get:
    tags: [bot]
    summary: Trade aggregate stats (dual-audience read)
    operationId: getBotStats
    security:
      - bearerAuth: []
      - serviceTokenAuth: []
    responses:
      "200":
        description: Totals, win rate, PnL, hold time, best/worst.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bot.yaml#/BotStatsResponse"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

equity:
  get:
    tags: [bot]
    summary: Daily cumulative PnL series (human-only)
    operationId: getBotEquity
    description: Aggregated by Europe/Warsaw day over CLOSED trades.
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Equity points, date ASC.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bot.yaml#/BotEquityListResponse"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

openPositions:
  get:
    tags: [bot]
    summary: Open positions alias (human-only, non-paged envelope)
    operationId: listBotOpenPositions
    description: |
      Same rows as GET /bot/trades?status=OPEN but a ListResponse envelope (no
      `page`) — the frontend normalizes this; Go must emit data+meta exactly.
    security:
      - bearerAuth: []
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          default: 20
    responses:
      "200":
        description: Open trades with live-price enrichment.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/bot.yaml#/BotTradeListResponse"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
