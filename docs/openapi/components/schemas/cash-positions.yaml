# --- Cash Positions ---
CashPosition:
  type: object
  required: [location, amountPln]
  properties:
    id:
      type: integer
      format: int64
      readOnly: true
    location:
      type: string
      maxLength: 100
      example: mBank
    amountPln:
      type: number
      format: double
    recordedAt:
      type: string
      format: date-time
      readOnly: true

CreateCashPositionsRequest:
  type: object
  required: [positions, recordedAt]
  properties:
    positions:
      type: array
      minItems: 1
      items:
        type: object
        required: [location, amountPln]
        properties:
          location:
            type: string
            maxLength: 100
          amountPln:
            type: number
            format: double
            minimum: 0
    recordedAt:
      type: string
      format: date-time

CashPositionsListResponse:
  type: object
  required: [data, meta]
  properties:
    data:
      type: array
      items:
        $ref: "#/CashPosition"
    meta:
      $ref: "./common.yaml#/Meta"

