# ---------------------------------------------------------------------------
# ENTRYPOINT — this is the SOURCE OF TRUTH for the API contract.
#
# Edit the files under docs/openapi/ (this file, components/, paths/), never
# hand-edit the generated docs/openapi.yaml bundle directly (it is overwritten
# on every regeneration and any manual edits to it will be silently lost).
#
# After editing, regenerate the bundle with:
#   npm run openapi:bundle     (redocly bundle docs/openapi/openapi.yaml -o docs/openapi.yaml)
#   npm run openapi:lint       (redocly lint docs/openapi/openapi.yaml)
# ---------------------------------------------------------------------------
openapi: "3.1.0"

info:
  title: Investing App API
  description: |
    Personal investment-tracking REST API. All endpoints (except the token
    exchange and health endpoints listed below) require a valid **backend JWT**
    passed as a Bearer token in the Authorization header.

    **Auth flow (ADR-032):**
    1. Client completes Google Sign-In → receives a short-lived Google ID token
       (1-hour expiry, managed entirely by Google Identity Platform).
    2. Client calls `POST /api/auth/token` with the Google ID token.
    3. Backend validates the Google token (JWK URI + `aud` claim + email allowlist)
       and, if valid, issues a signed backend JWT (HMAC-SHA256, 30-day expiry).
    4. Client stores the backend JWT (web: memory/React context).
    5. All subsequent API requests carry `Authorization: Bearer <backend-jwt>`.
    6. After 30 days, client repeats from step 1.

    **Unauthenticated endpoints:** `POST /auth/token`, `/actuator/health`,
    `/swagger-ui/**`, `/api-docs/**`
  version: "1.0.0"
  contact:
    name: Wojtek

servers:
  - url: http://investing-rpi/api
    description: Production (Tailscale MagicDNS)
  - url: http://localhost:8080/api
    description: Local development

security:
  - bearerAuth: []

