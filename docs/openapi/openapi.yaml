tags:
  - name: auth
    description: Token exchange — obtain a backend JWT from a Google ID token
  - name: positions
    description: Investment positions (MAIN and RETIREMENT portfolios)
  - name: deposits
    description: >
      Capital deposits, XIRR, and IKE/IKZE cap tracking. Deposits are the ONLY
      capital record; all deposits count in XIRR and totalInvestedPln (ADR-035).
  - name: binance-transfers
    description: >
      Binance transfer side ledger (PIT-38 crypto acquisition costs) — distilled
      from deposits, not additional capital (ADR-035)
  - name: historia
    description: Daily portfolio value snapshots
  - name: cash-positions
    description: Cash balance snapshots
  - name: news
    description: >
      Daily AI-researched asset news (ADR-041). Read endpoints (GET /news,
      GET /news/dates) use the normal Google-JWT bearer auth; the machine
      endpoints (GET /news/assets, POST /news/ingest, POST /news/notifications)
      used by the nightly host cron job instead require the X-Service-Token header.
  - name: push
    description: >
      Web Push opt-in per browser (ADR-108): VAPID config, subscription upsert/delete and
      the "Wyślij testowe powiadomienie" test send. Bearer JWT only. The morning-report
      fan-out itself is POST /news/notifications (service token).
  - name: bot
    description: >
      OKX macro-calendar trading tracker (Phase 5, investing-only; ADR-089/090/092/093).
      Machine-only writes (plan ingest, calendar sync, signals, all /bot/trades/**
      writes) require the X-Service-Token header; dual-audience reads
      (GET /bot/calendar, GET /bot/trades[/**], GET /bot/stats) accept either
      credential; everything else is human bearer-JWT only. Live order placement
      itself is scheduler-internal (no HTTP trigger) — see ADR-090.
  - name: market-data
    description: Live prices, FX rates, and regression chart data
  - name: crypto-trades
    description: Crypto trade log and PIT-38 tax summary
  - name: tax-returns
    description: Annual PIT-38 Belka tax returns
  - name: inflation
    description: Polish CPI data
  - name: settings
    description: >
      Application settings (contribution limits, rebalancing.macro_derisk_enabled — gates
      the ADR-044 macro blend interpolation — etc.). The blend calibration constants
      (net-liq/Global-M2 weighting, smoothing window, steepness) are shipped as backend
      code constants, not adjustable settings — see ADR-044 §7. The macro liquidity
      de-risk state itself (blendFactor, zone, riskOff telemetry) is read via
      GET /market-data/macro-state.
  - name: purchase-sessions
    description: Monthly DCA purchase planning and execution
  - name: rebalancing-transfers
    description: Ad-hoc position transfers outside purchase sessions
