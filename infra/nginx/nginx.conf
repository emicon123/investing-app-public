    # ── backend-go auth/token (Phase 9 — Go rewrite, ADR-094/doc 13 §6.4/§7 — GoOwned) ──
    # AuthController's Google-ID-token exchange (task 152 §1.2) — the single highest-blast-radius
    # cutover in the whole migration: every login, this app, moves here. Deliberately last of any
    # domain to flip (doc 13 §6.4). Existing sessions are unaffected regardless of cutover timing —
    # ValidateBackendJWT has been cross-language-compatible since Phase 0, so a token issued by
    # either backend validates against either backend's RequireAuth/smartAuth. This route is itself
    # exempt from smartAuth's auth gate (backend-go/cmd/server/botauth.go's isPublicAuthToken) —
    # nothing to configure here beyond the proxy_pass, no auth-related nginx change needed.
    # Rollback: none at this layer — Java is retired (see the ROLLBACK note at the top of this
    # file). Tokens issued by Go are the only ones now; a restored Java would validate them the
    # same way (shared HS256 secret), so no session invalidation either way.
    location = /api/auth/token {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Generic catch-all for every /api/* path not matched by an explicit block above — proxied
    # to backend-go (ADR-098 Decision 4; formerly the Java backend). Deliberately NOT deleted:
    # without it an unknown /api/x would fall to `location /` (SPA try_files -> /index.html)
    # and answer 200 HTML instead of Go's 404 JSON envelope. Keeps the `limit_req` that
    # (today) lives only on the three generic catch-all blocks.
    # Do NOT strip /api here — backend-go mounts its routes under /api and expects the full
    # path including that prefix (no URI part on proxy_pass, so the request URI passes through).
    location /api/ {
        limit_req           zone=api_limit burst=20 nodelay;
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Ticket to Ride — served under /ticket/ prefix ──────────────────────────
    # (Node.js/Socket.IO on host, reached via host.docker.internal)
    # TTR uses absolute asset paths (/assets/, /play/), so we rewrite HTML to use
    # prefix-relative paths. Socket.IO connects to the page origin's /socket.io/
    # by default, which we proxy here at the root level.

    location /socket.io/ {
        proxy_pass         http://host.docker.internal:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade              $http_upgrade;
        proxy_set_header   Connection           "upgrade";
        proxy_set_header   Host                 $host;
        proxy_set_header   X-Real-IP            $remote_addr;
        proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto    $scheme;
    }

    location /ticket/play/ {
        proxy_pass         http://host.docker.internal:3001/play/;
        sub_filter_once    off;
        sub_filter_types   text/html application/javascript;
        sub_filter         'src="/play/'  'src="/ticket/play/';
        sub_filter         'href="/play/' 'href="/ticket/play/';
        sub_filter         "/play/"        "/ticket/play/";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /ticket/ {
        proxy_pass         http://host.docker.internal:3001/;
        sub_filter_once    off;
        sub_filter_types   text/html;
        sub_filter         'src="/assets/'  'src="/ticket/assets/';
        sub_filter         'href="/assets/' 'href="/ticket/assets/';
        sub_filter         'href="/play/'   'href="/ticket/play/';
        sub_filter         "/play/"          "/ticket/play/";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

