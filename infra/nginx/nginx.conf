    # ── backend-go news + bot (Phase 5 — Go rewrite, ADR-094/doc 13 §7 — GoOwned) ──
    # NewsController (GET /news, GET /news/dates, GET /news/assets, POST /news/ingest) and the
    # whole bot subsystem (BotCalendar/Control/Plan/Signal/Stats/TradeControllers — every
    # /bot/** path) now route to backend-go. Unlike Phase 1/1B/2/3/4's exact-match discipline,
    # these are two plain prefix blocks (no rewrite — /api passes through unchanged, same as
    # every phase above): /api/news as a bare prefix covers the bare /api/news GET too, and
    # /api/bot/ covers the whole subsystem (bare /bot exists on neither backend). Zero
    # collision risk: no other controller shares the /news or /bot/ prefix (verified against
    # every @RequestMapping), and /portfolio-b|/portfolio-c/api/ blocks live under their own prefixes.
    # Default 30s timeouts (no 180s block — sync/ingest complete in seconds per smoke).
    # MONEY-CRITICAL: the flip moves HTTP traffic only — live OKX order placement stays
    # gated by BOT_LIVE_EXECUTION_ENABLED (absent → OFF in this stack; verified in the
    # container env), independently of the scheduler flag below. The bot watcher/purger
    # scheduler flipped to Go 2026-09-19 (BOT_SCHEDULER_ENABLED=true, ADR-097/incident
    # 153 — same shadow-gate-left-off pattern as historia's, no observed harm since
    # bot_trade was empty at the time): Java's container is stopped, so Go is now the
    # sole watcher/purger. No live orders until a separately agreed paper/demo burn-in
    # explicitly enables BOT_LIVE_EXECUTION_ENABLED. Coexistence smoke 2026-09-16
    # (direct backend-go:8091 vs the then-live Java backend): news GETs + bot GETs identical modulo
    # rendering (createdAt/updatedAt trailing-zero trim, NUMERIC scale e.g. -7.0 vs -7 —
    # same Phase 4 precedent), scenario/set ORDER differs only (Go id/ticker-sorted vs
    # Java incidental DB order — same rows, same content), ?impact= lowercase accepted by
    # Go vs Java 400 (spec enum is uppercase; frontend sends uppercase), calendar sync
    # 105/105 identical, full trade lifecycle (create→request-manage→actions→ticks→
    # scalp-claim/finish rejections→close, incl. MAX_CONCURRENT_TRADE + DUPLICATE_TRADE_WINDOW
    # guards and pnlPln 0.1==0.1000000000) byte-parity modulo the rendering above; control
    # PATCH verified + restored; unit gate TestExecute_FlagOff* green; zero OKX strings in
    # Go logs across the whole smoke. Rollback: none at this layer — Java is retired (see
