server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 1m;
    proxy_read_timeout   30s;
    proxy_send_timeout   30s;

    # ── Backend routing: Java is retired (Phase 9, ADR-098) ────────────────────────
    # Every /api/* path — investing-app here, /portfolio-b/api/* and /portfolio-c/api/* for the sibling
    # apps — is served by the Go backends: backend-go:8091 / backend-go-portfolio-b:8092 /
    # backend-go-portfolio-c:8093. There is no Java upstream and no Java container any more. Each
    # domain has its own explicit block below (historical phase notes are kept as the record of
    # how it was cut over), and each app ends with ONE generic `/api/` catch-all that ALSO
    # points at Go. The catch-alls are deliberately kept, not deleted (ADR-098 Decision 4): with
    # no catch-all an unknown `/api/x` would fall through to `location /` (SPA `try_files ...
    # /index.html`) and answer 200 with HTML instead of Go's 404 JSON envelope. They also carry
    # the only `limit_req zone=api_limit`.
    # ROLLBACK, wherever a block below says "Rollback": there is no nginx-level fallback. Java
    # has no running container and no upstream here; going back means restoring the Java trees
    # and compose services from git (see ADR-098 "Consequences"), not re-pointing a location
    # block.

    # Docker's embedded DNS. A literal hostname in proxy_pass (e.g. `proxy_pass
    # http://backend-go:8091;`) is resolved ONCE, at nginx process startup, and never
    # again — so recreating `backend-go`/`backend-go-portfolio-b`/`frontend-portfolio-b`/
    # `backend-go-portfolio-c`/`frontend-portfolio-c` (new container = new IP on investing-shared)
    # silently breaks routing to it until nginx itself is restarted (2026-09-02
    # incident, then with the Java backends: portfolioB/portfolioC 502s, main app login-bounce via
    # a dead /api/auth/token route, for hours, from exactly this). Using a variable in
    # proxy_pass instead forces nginx to re-resolve via this resolver on every TTL expiry,
    # so a container recreate self-heals within `valid` seconds — no nginx restart needed
    # for any proxied location below (every one uses `set $var host;` + `proxy_pass
    # http://$var:port;`, with an explicit `rewrite ... break` wherever a prefix is stripped).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header X-Frame-Options           "DENY"                              always;
    add_header X-Content-Type-Options    "nosniff"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com https://www.googleapis.com https://api.web3forms.com; frame-src https://accounts.google.com; frame-ancestors 'none'" always;

    # Serve React SPA static files. index.html (and the SPA-fallback response
    # for client-side routes) must always be revalidated — it's what pins the
    # browser to a specific build's hashed asset filenames.
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashes every file under /assets/ — a new deploy always
    # ships new filenames, so these are safe to cache aggressively. Also
    # closes the "Failed to fetch dynamically imported module" failure mode:
    # without this, a tab open across a redeploy could still end up holding a
    # stale index.html (via browser heuristic caching) referencing chunk
    # hashes the new deploy no longer serves.
    location /assets/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Web Push static files (ADR-108 §6 / task 172) ──────────────────────────────────
    # The service worker and the web app manifest are plain, UNHASHED files copied by Vite
    # from apps/main/frontend-web/public/ into dist/. Exact-match blocks so they never reach
    # `location /`'s SPA fallback: a missing file must answer 404, not index.html (a browser
    # would otherwise try to register HTML as the worker). `no-cache` makes the browser
    # revalidate on every update check, so a new sw.js / manifest is picked up after a deploy.
    # The explicit `types` maps pin the MIME types (a service worker is only accepted with a
    # JavaScript type). Exact matches on the root path only: /portfolio-b/* and /portfolio-c/* are not
    # affected (the worker itself has no fetch listener, so its root scope cannot touch them).
    location = /sw.js {
        root   /usr/share/nginx/html;
        try_files $uri =404;
        types { application/javascript js; }
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        root   /usr/share/nginx/html;
        try_files $uri =404;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }
    # Manifest and notification icons. Unhashed filenames, so cache for a day rather than
    # `immutable`; a 404 here must not fall back to index.html either.
    location /icons/ {
        root   /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Macro recompute is the one legitimately long-running endpoint: it makes ~14 sequential
    # upstream fetches (FRED ×8, ECB, BoE, BoJ, chinadata.live, plus the ADR-068 China-M2 tip
    # scrapes). Measured ~11s on an idle Pi, but observed ~40s when it collided with the
    # scheduled 43-ticker price refresh — which blew the 30s default and returned a 504 to the
    # user even though the backend completed and committed the transaction 4s later. Exact-match
    # location so this longer timeout applies to this endpoint ONLY; the 30s default above stays
    # in force for every other API call, where a slow response really does mean something is wrong.
    # Phase 1B (2026-09-15): routes to backend-go:8091 — timeouts unchanged.
    location = /api/market-data/macro-state/refresh {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── backend-go health check (Phase 0 — Go rewrite, ADR-094/doc 13 §6.1) ────────
    # Phase 0 liveness endpoint, kept as a cheap reachability probe for backend-go. Exact-match
    # `location =` so this wins over the `/api/` catch-all below without needing any
    # location-ordering trick; same resolver already declared at the top of this
    # file covers this location too (resolver is server-block-scoped, not location-scoped).
    location = /api/health-go {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── backend-go market-data (Phase 1 — Go rewrite, ADR-094/doc 13 §6.1/§6.2 — GoOwned) ──────
    # MarketDataController's endpoints (price/fx-rate list+refresh) now route to backend-go.
    # IMPORTANT: `/market-data` is also the prefix for LinearRegressionController's
    # /market-data/linear-regression and TradeChartController's /market-data/trade-chart* (Phase 4)
    # and the macro-state*/benchmark-history/macro/m2-manual endpoints (Phase 1B) — each has its
    # own block further down. A prefix rule here (`location /api/market-data/`) would have
    # wrongly captured those mid-migration, so every path gets its own exact-match `location =`
    # instead (kept that way). Coexistence smoke test (backend-go/hack/coexistence-smoke-test.sh,
    # retired with Java per ADR-098) run
    # 2026-09-15 against both backends directly (bypassing Nginx) — 4/4 endpoints functionally
    # equivalent (one nominal jq-diff "mismatch" on GET /prices was JSON key-ordering only,
    # verified byte-identical ticker/currency sets) — burn-in judged low-risk per doc 13 §7
    # (read-mostly, external-HTTP-dependent; worst case is a stale price, not a wrong balance).
    # Rollback: none at this layer — Java is retired (see the ROLLBACK note at the top of this file).
    location = /api/market-data/prices {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/market-data/prices/refresh {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/market-data/fx-rates {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/market-data/fx-rates/refresh {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── backend-go market-data macro (Phase 1B — Go rewrite, ADR-094/doc 13 §6.1/§6.2 — GoOwned) ──
    # MacroDataController's endpoints (macro-state, its history, manual M2 upsert, benchmark
    # history) now route to backend-go; macro-state/refresh (the 180s-timeout block at the top of
    # this file) flipped with them. Same exact-match discipline as Phase 1 above: NO prefix rule
    # here — Phase 4's /market-data/linear-regression and /market-data/trade-chart* have their own
    # exact blocks below. Coexistence smoke 2026-09-15
    # (direct backend-go:8091 vs the then-live Java backend): GET macro-state numerically identical, GET history
    # 14/14 identical, GET benchmark-history 627/628 identical (only today's forming weekly candle
    # differs, rel 2e-05 — different Yahoo fetch instants into each backend's 12h cache), POST
    # refresh identical blendFactor/zone/compositeZ/smoothedZ (Go ~10s vs Java ~39s), POST
    # m2-manual validates on Go (422 per docs/openapi.yaml vs Java's 400 — spec is binding for Go).
    # Rollback: none at this layer — Java is retired (see the ROLLBACK note at the top of this file).
    location = /api/market-data/macro-state {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/market-data/macro-state/history {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/market-data/macro/m2-manual {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/market-data/benchmark-history {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── backend-go inflation/tax/cash/settings (Phase 2 — Go rewrite, ADR-094/doc 13 §7 — GoOwned) ──
    # InflationController (GET/POST /inflation, POST /inflation/sync), TaxReturnsController
    # (GET/POST /tax-returns), CashPositionsController (GET/POST /cash-positions) and
    # SettingsController (GET /settings, PUT /settings/{key}) now route to backend-go.
    # Same exact-match discipline as Phase 1/1B above: NO prefix rule here, except the single
    # /api/settings/ prefix below which covers ONLY PUT /settings/{key} (SettingsController's
    # sole sub-path — no other controller shares the /settings prefix, unlike /market-data's
    # Phase 4 trap). Every other /api/* path falls through to the generic /api/ block below
    # (also backend-go). Coexistence smoke 2026-09-15 (direct
    # backend-go:8091 vs the then-live Java backend): POST /inflation/sync Go 200 in ~34.8s vs Java 200 in
    # ~31.4s (upserts 0=0, total 320->320, no partial commit — scopedTimeout 180s fix verified),
    # GET /inflation 320/320 identical, GET /tax-returns 0/0, GET /cash-positions 4/4
    # float-equal, GET /settings 4/4 identical. Rollback: none at this layer — Java is retired
    # (see the ROLLBACK note at the top of this file).
    location = /api/inflation {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/inflation/sync {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/tax-returns {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/cash-positions {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/settings {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /api/settings/ {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── backend-go historia (Phase 3 — Go rewrite, ADR-094/doc 13 §7 — GoOwned) ──
    # HistoriaController's endpoint (GET /history) now routes to backend-go. Single
    # exact-match `location =` — no prefix rule, no rewrite (`/api` passes through
    # unchanged, same as Phase 1/1B/2 above). Default 30s timeouts (GET-only; no 180s
    # block). Coexistence smoke 2026-09-15 (direct backend-go:8091 vs the then-live Java backend):
    # 12/13 identical (default/ALL/MAIN/RETIREMENT, page/size incl. size=1000 as the
    # frontend sends, size<=0→50, from/to ranges, out-of-range page, bad portfolio →
    # byte-identical 400); sole divergence ?page=-1 (Go 400 VALIDATION_ERROR vs Java
    # accidental 500 — negative from/to escapes HistoriaIterator.subList into the
    # generic handler; frontend always sends page>=0, non-blocking per Phase 1B
    # 422-vs-400 precedent). Scheduler write-path flipped to Go 2026-09-19
    # (HISTORIA_SCHEDULER_ENABLED=true, ADR-097/incident 153): the Java container was
    # already stopped (commit 16e3433, 2026-09-18) ahead of this flip, causing a
    # 1-day snapshot gap backfilled per ADR-097 — Go is now the sole 23:00 Warsaw
    # historia writer, with zero double-write risk since Java cannot run. Rollback:
    # none at this layer — Java is retired (see the ROLLBACK note at the top of this
    # file), and no read-routing change here would restore a snapshot writer anyway —
    # see ADR-097 before touching the scheduler flag itself.
    location = /api/history {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── backend-go crypto/regression/chart/binance (Phase 4 — Go rewrite, ADR-094/doc 13 §7 — GoOwned) ──
    # CryptoTradesController (GET/POST /crypto-trades, GET /crypto-trades/tax-summary),
    # LinearRegressionController (GET /market-data/linear-regression), TradeChartController
    # (GET /market-data/trade-chart/tickers, GET /market-data/trade-chart) and
    # BinanceTransfersController's own endpoints (GET/POST /binance-transfers,
    # DELETE /binance-transfers/{id}) now route to backend-go. Same exact-match discipline as
    # Phase 1/1B/2/3 above: NO prefix rule here, except the single /api/binance-transfers/
    # prefix below which covers ONLY DELETE /binance-transfers/{id} (that controller's sole
    # sub-path — no other controller shares the /binance-transfers prefix). Every other /api/*
    # path falls through to the generic /api/ block below (also backend-go).
    # PARTIAL port at the time (Phase 4 task open item, doc 13 §6.3): the purchase-completion-triggered
    # insert into binance_transfers stayed Java-owned until Phase 7 (now Go, see the Phase 7
    # block) — it is an in-process
    # PurchaseSessionService.binanceTransferRepository.save call reached via /purchase-sessions,
    # never via HTTP to /api/binance-transfers*, so these blocks
    # cannot capture it. Coexistence smoke 2026-09-16 (direct backend-go:8091 vs the then-live Java backend):
    # GET /crypto-trades identical modulo meta, POST /crypto-trades both 201 source MANUAL
    # (Go 422 vs Java 400 on invalid body per docs/openapi.yaml, same precedent as Phase 1B/2),
    # GET tax-summary?year=2026 identical incl. with smoke data (PIT-38 totals 0.8/-0.8),
    # GET linear-regression?ticker=BTC-USD 628/628 points (max rel diff 1.6e-14 float epsilon),
    # GET trade-chart/tickers identical, GET trade-chart?ticker=BTC-USD 628/628 series
    # identical + 3/3 trades, GET/POST binance-transfers identical modulo NUMERIC scale +
    # createdAt fractional rendering, DELETE 204 + re-DELETE 404 NOT_FOUND identical.
    # Rollback: none at this layer — Java is retired (see the ROLLBACK note at the top of this file).
    location = /api/crypto-trades {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/crypto-trades/tax-summary {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/market-data/linear-regression {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/market-data/trade-chart/tickers {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/market-data/trade-chart {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /api/binance-transfers {
        set                $backend_go backend-go;
        proxy_pass         http://$backend_go:8091;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /api/binance-transfers/ {
        set                $backend_go backend-go;
