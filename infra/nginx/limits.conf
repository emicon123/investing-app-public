# http-level rate limit zones. Must live outside the server{} block in default.conf,
# and must load before it (hence the 00- prefix — conf.d/*.conf is included in
# alphabetical order). Applied per-location in nginx.conf via `limit_req zone=...`.
# Port 80 is Tailscale-Funneled to the public internet, so every API surface behind
# it needs baseline throttling against brute-force/credential-stuffing/DoS.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
