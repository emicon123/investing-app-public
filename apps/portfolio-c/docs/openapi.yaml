        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SingleResponseSettingDto'
  /positions/{id}:
    get:
      tags:
      - positions-controller
      operationId: getPosition
      summary: Get one subasset position
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '500':
          description: Internal Server Error
          content:
