  /purchases/confirm:
    post:
      tags:
      - rebalancing-controller
      operationId: confirm
      summary: Confirm a purchase plan
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: >-
          Client-generated key (one random UUID per user intent) that makes this
          money-moving request safe to retry. Same key + same request after a 2xx
          replays the stored response (header Idempotent-Replayed: true); same key
          while in progress or after a 5xx -> 409 IDEMPOTENCY_IN_PROGRESS; same key
          with a different request -> 422 IDEMPOTENCY_KEY_REUSED; malformed key ->
          400 VALIDATION_ERROR. Omitted -> no deduplication. Root docs/openapi
          components/parameters.yaml#/IdempotencyKey and ADR-111 are the full contract.
        schema:
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPurchasesRequest'
        required: true
      responses:
        '422':
          description: Idempotency-Key already used for a different request (IDEMPOTENCY_KEY_REUSED, ADR-111)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
