  /assets/{id}:
    put:
      tags:
      - positions-controller
      operationId: updateAsset
      summary: Update asset-level fields and targets
      description: >
        Edits asset-level fields — the only writer of targets (task 156). Every field
        is optional (omitted = unchanged). Like the old PUT /positions/{id} target
        edit there is no Σ == 100 check here: moving weight between two assets is two
        edits, so the portfolio is briefly off 100 by design (the UI's "Σ Cel"
        indicator exists for this).
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetRequest'
        required: true
      responses:
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SingleResponseAssetDto'
    delete:
      tags:
      - positions-controller
      operationId: deleteAsset
      summary: Soft-delete an asset and its subassets
      description: >
        Soft-deletes a whole asset and all its live subassets in one statement
        (task 173, sets deleted_at). History rows (position_transfers, purchase_lots,
        historia) are untouched and never block the delete. 404 when unknown or
        already deleted.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
