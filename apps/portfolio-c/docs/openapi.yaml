components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/Meta'
    Meta:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    UpdateSettingRequest:
      type: object
      properties:
        value:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - value
    SettingDto:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        updatedAt:
          type: string
          format: date-time
    SingleResponseSettingDto:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SettingDto'
        meta:
          $ref: '#/components/schemas/Meta'
    UpdatePositionRequest:
      type: object
      description: >
        Subasset-owned fields only. Targets live on the parent asset (PUT /assets/{id});
        a subasset row has no target.
      properties:
        units:
          type: number
          format: double
          minimum: 0.0
        totalSpentPln:
          type: number
          format: double
          description: >
            Explicit correction of this row's cost slot in PLN - the only way a manual edit
            changes cost (a units edit never does). Only the SUM over the asset's subassets is
            meaningful (the head row carries the group's go-live baseline; a sale re-scales every
            row that carries cost). The reviewed way to set a baseline. Absent = unchanged.
        avgBuyPrice:
          type: number
          format: double
          deprecated: true
          description: >
            DEPRECATED. Stale native-currency go-live average: still accepted and stored, but
            nothing reads it and no trade writes it. The entry price is
            `computed.avgBuyPricePln` / `computed.avgBuyPriceNative`, derived from the recorded costs.
            Absent = unchanged.
        name:
          type: string
        groupName:
          type: string
        assetClass:
          type: string
          enum:
          - ETF
          - METALS
          - CRYPTO
          - STOCK
          - CURRENCY
        yahooTicker:
          type: string
        sortOrder:
          type: integer
          format: int32
        assetId:
          type: integer
          format: int64
          description: >
            Re-home this subasset under another asset (non-primary only; same portfolio; ignored when
            equal to the current asset).
    UpdateAssetRequest:
      type: object
      description: >
        Asset-level fields (task 156) — the only writer of targets. Absent key = leave
        unchanged; targetAllocationPct / targetAllocationPctRiskOff explicitly set to
        null = CLEAR the target (NULL = no target); 0 = an explicit zero target (ADR-053,
        distinct from NULL); each set value must be within 0..100.
      properties:
        targetAllocationPct:
          type: [number, "null"]
          format: double
          maximum: 100.0
          minimum: 0.0
        targetAllocationPctRiskOff:
          type: [number, "null"]
          format: double
          maximum: 100.0
          minimum: 0.0
        name:
          type: string
    NewAssetRequest:
      type: object
      description: >
        Inline asset payload for POST /positions without assetId (task 156): creates a
        new asset (targets live here, never on the subasset row) with this subasset as
        its first — trivially primary — member.
      properties:
        name:
          type: string
        exposure:
          type: string
          enum:
          - CRYPTO
          - METALS
          - STOCKS
          - COMMODITIES
          - CURRENCY
        assetClass:
          type: string
          enum:
          - ETF
          - METALS
          - CRYPTO
          - STOCK
          - CURRENCY
        targetAllocationPct:
          type: number
          format: double
          maximum: 100.0
          minimum: 0.0
        targetAllocationPctRiskOff:
          type: number
          format: double
          maximum: 100.0
          minimum: 0.0
      required:
      - assetClass
      - exposure
      - name
    SetAssetPrimaryRequest:
      type: object
      properties:
        subassetId:
          type: integer
          format: int64
      required:
      - subassetId
    ComputedPositionFields:
      type: object
      description: >
        Group-level computed fields, resolved at query time from cached prices; never stored.
        `valuePln` = sum over the asset's priced subassets; `unitsTotal` / `pricePln` /
        `priceNative` describe the primary subasset. `profitPct`, `avgBuyPricePln`,
        `avgBuyPriceNative`, `equivalentUnits` and `costlessSubassets` are the asset-level cost
        group (task 161): they read the SUM of the recorded costs (`totalSpentPln` > 0) over all
        subassets of the asset - never one row's cost and never the stored `avgBuyPrice`. A null
        field is omitted from the response; all are omitted when no cost is recorded.
      properties:
        unitsTotal:
          type: number
          format: double
        pricePln:
          type: number
          format: double
        priceNative:
          type: number
          format: double
        valuePln:
          type: number
          format: double
        currentPct:
          type: number
          format: double
        deviationPct:
          type: number
          format: double
        profitPct:
          type: number
          format: double
          description: >
            Asset-level profit as a fraction (0.1 = +10 %): `sum(value) / sum(cost) - 1`, where
            sum(cost) = sum of `totalSpentPln` over the asset's subassets whose cost is > 0 and
            sum(value) = sum of `effectiveUnits x pricePln` over EVERY priced subasset, including
            those with no recorded cost (the go-live cost of a group sits on the head row). A
            subasset with a recorded cost but no price contributes neither. Omitted when
            sum(cost) <= 0 - every portfolio-b asset until its reviewed baselines exist - or when the
            primary is unpriced. Independent of which subasset is primary.
        avgBuyPricePln:
          type: number
          format: double
          description: >
            The asset's ENTRY PRICE in PLN per 1 unit of the PRIMARY subasset:
            `pricePln / (1 + profitPct)` = `sum(cost) / (sum(value) / pricePln)`, so
            `avgBuyPricePln x equivalentUnits = sum(cost)` and
            `pricePln / avgBuyPricePln - 1 = profitPct`. Non-primary holdings are converted at
            today's prices (no history). Derived from the recorded costs, not from the stored
            `avgBuyPrice`. Omitted whenever `profitPct` is omitted or is -1. Changing the primary
            re-expresses the same cost in the new primary's terms. Not stored.
        avgBuyPriceNative:
          type: number
          format: double
          description: >
            The entry price in the PRIMARY subasset's own `priceCurrency`: `avgBuyPricePln / fx`
            with fx the CURRENT PLN rate of that currency (the rate `priceNative = pricePln / fx`
            uses) = `priceNative / (1 + profitPct)`. The PLN cost is fixed, so it moves with the
            current exchange rate by design. Equals `avgBuyPricePln` when `priceCurrency` is PLN.
            Omitted whenever `avgBuyPricePln` is omitted or the FX rate is unavailable. Not
            stored; never derived from the stored `avgBuyPrice`.
        equivalentUnits:
          type: number
          format: double
          description: >
            Primary-equivalent units `valuePln / pricePln`: what all the asset's holdings are worth
            today in units of the primary; the quantity the entry price averages the cost over
            (`avgBuyPricePln x equivalentUnits = sum(cost)`). Present whenever the primary is
            priced, independent of whether any cost is recorded.
        costlessSubassets:
          type: array
          items:
            type: string
          description: >
            Tickers (`SubassetDto.ticker`) of the asset's priced subassets that hold units but
            have no recorded cost (`totalSpentPln` null or <= 0), listed only when an entry price
            is computed (sum(cost) > 0). Their baseline is assumed to sit inside a sibling's
            group-level cost - the known limitation of the entry price (a subasset bought
            without its cost being entered inflates `profitPct` and lowers the entry price).
            Omitted when there are none.
    AssetDto:
      type: object
      description: >
        One logical asset (task 156): the group root carrying targets, exposure and
        asset class, with group-level computed fields (valuePln = Σ subassets,
        deviationPct on the asset) and the member subassets, primary first.
      properties:
        id:
          type: integer
          format: int64
        portfolio:
          type: string
          enum:
          - VARIABLE
          - FIXED
        key:
          type: string
          description: >
            Stable per-portfolio identity, immutable. A lowercase logical slug for a
            multi-subasset asset (an asset is the abstraction, never named after one
            fund); the holding's own ticker for a single-subasset asset (every live
            portfolio-c asset today). Never join on it: subassets reference their asset by
            assetId.
        name:
          type: string
        exposure:
          type: string
          enum:
          - CRYPTO
          - METALS
          - STOCKS
          - COMMODITIES
          - CURRENCY
        assetClass:
          type: string
          enum:
          - ETF
          - METALS
          - CRYPTO
          - STOCK
          - CURRENCY
        targetAllocationPct:
          type: number
          format: double
        targetAllocationPctRiskOff:
          type: number
          format: double
          description: Always null in this app (no macro gate); present for cross-app uniformity.
        computed:
          $ref: '#/components/schemas/ComputedPositionFields'
        subassets:
          type: array
          items:
            $ref: '#/components/schemas/SubassetDto'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SingleResponseAssetDto:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AssetDto'
        meta:
          $ref: '#/components/schemas/Meta'
    SubassetDto:
      type: object
      description: One concrete holding within an asset (one positions row, task 156).
      properties:
        id:
          type: integer
          format: int64
        assetId:
          type: integer
          format: int64
        isPrimary:
          type: boolean
          description: Exactly one subasset per asset is primary = default buy destination.
        ticker:
          type: string
        name:
          type: string
        exchange:
          type: string
          enum:
          - XTB
          - BINANCE
          - OTHER
        yahooTicker:
          type: string
        priceCurrency:
          type: string
          enum:
          - PLN
          - EUR
          - USD
          - CHF
          - GBP
        units:
          type: number
          format: double
        effectiveUnits:
          type: number
          format: double
        pricePln:
          type: number
          format: double
        priceNative:
          type: number
          format: double
        valuePln:
          type: number
          format: double
        groupName:
          type: string
        sortOrder:
          type: integer
          format: int32
    AccountCashUpdateRequest:
      type: object
      properties:
        balancePln:
          type: number
          format: double
          minimum: 0.0
      required:
      - balancePln
    AccountCashDto:
      type: object
      properties:
