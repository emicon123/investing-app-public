    CreatePositionRequest:
      type: object
      description: >
        Creates one subasset holding (task 156): either under an existing asset
        (assetId set — isPrimary defaults to false) or under a brand-new asset
        (assetId omitted + inline newAsset carrying the targets — the new asset's
        first subasset is trivially primary). A subasset row has no target: targets
        live on the asset (newAsset here, PUT /assets/{id} afterwards).
      properties:
        portfolio:
          type: string
          enum:
          - VARIABLE
          - FIXED
        ticker:
          type: string
          maxLength: 20
          minLength: 0
        name:
          type: string
          maxLength: 200
          minLength: 0
        exchange:
          type: string
          enum:
          - XTB
          - BINANCE
          - OTHER
        assetClass:
          type: string
          enum:
          - ETF
          - METALS
          - CRYPTO
          - STOCK
          - CURRENCY
        exposure:
          type: string
          enum:
          - CRYPTO
          - METALS
          - STOCKS
          - COMMODITIES
          - CURRENCY
        priceCurrency:
          type: string
          enum:
          - PLN
          - EUR
          - USD
          - CHF
          - GBP
        yahooTicker:
          type: string
          maxLength: 50
          minLength: 0
        sortOrder:
          type: integer
          format: int32
        assetId:
          type: integer
          format: int64
        isPrimary:
          type: boolean
        newAsset:
          $ref: '#/components/schemas/NewAssetRequest'
      required:
      - assetClass
      - exchange
      - exposure
      - name
      - priceCurrency
      - ticker
