        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SingleResponseAssetDto'
  /assets/{id}/primary:
    post:
      tags:
      - positions-controller
      operationId: setAssetPrimary
      summary: Set the primary subasset of an asset
      description: >
        Flips which subasset of an asset is primary (task 156 — replaces
        POST /positions/{id}/promote). Pure boolean flip in one transaction: no units
        move, no cost basis migrates (per-subasset cost data stays on the row that holds
        it), no sibling repointing (membership is the asset_id FK, not a string). The
        per-portfolio Σ targets == 100 guard promote carried is kept: no target moves on
        a flip, so it only answers 400 (before any write) when the stored portfolio
        already violates the invariant. 404 unknown asset; 400 when subassetId does not
        belong to the asset.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAssetPrimaryRequest'
        required: true
      responses:
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
