# OpenAPI contract for portfolio-c. Originally snapshotted from the retired Java backend's
# springdoc endpoint (2026-09-17); since the Java retirement (ADR-098) this single file is the
# hand-maintained source of truth (there is no bundling step). Keep it `redocly lint`-clean
# (root redocly.yaml; `npm run openapi:lint:all` from the repo root) and regenerate the Go server
# with `go generate ./openapi/` in backend-go/ after every edit.
openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://127.0.0.1:8082/api
  description: Generated server url
tags:
- name: auth
  description: Token exchange
security:
- bearerAuth: []
paths:
  /settings/{key}:
    put:
      tags:
      - settings-controller
      operationId: updateSetting
      summary: Update one setting
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingRequest'
        required: true
      responses:
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
