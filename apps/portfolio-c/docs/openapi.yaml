    post:
      tags:
      - positions-controller
      operationId: createPosition
      summary: Create a subasset position
      description: >
        Task 173: if the ticker matches a soft-deleted subasset (or newAsset's key a
        soft-deleted asset), that row is restored instead of inserted. It keeps the same
        id, units, cost basis and history; required fields are overwritten, optional ones
        are kept unless sent. 409 only for a live duplicate.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePositionRequest'
        required: true
      responses:
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
