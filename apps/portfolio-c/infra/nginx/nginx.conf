server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. A literal hostname in proxy_pass is resolved ONCE at
    # nginx startup — `backend-portfolio-c` (retired Java backend) no longer resolves,
    # which used to kill this container on every recreate ([emerg] boot loop).
    # A variable defers resolution to request time so static-file serving stays up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Serve React SPA static files. index.html (and the SPA-fallback response
    # for client-side routes) must always be revalidated — it's what pins the
    # browser to a specific build's hashed asset filenames.
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashes every file under /assets/ — a new deploy always
    # ships new filenames, so these are safe to cache aggressively. Also
    # closes the "Failed to fetch dynamically imported module" failure mode:
    # without this, a tab open across a redeploy could still end up holding a
    # stale index.html (via browser heuristic caching) referencing chunk
    # hashes the new deploy no longer serves.
    location /assets/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy all API calls to Spring Boot backend
    # (vestigial: no traffic reaches this block in production — main Nginx routes
    # /portfolio-c/api/* itself. Variable keeps startup safe now that backend-portfolio-c
    # no longer resolves.)
    location /api/ {
        set                  $portfolio_c_backend_upstream backend-portfolio-c;
        proxy_pass         http://$portfolio_c_backend_upstream:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
