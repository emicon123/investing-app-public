version: "2"
sql:
  - engine: "postgresql"
    # Points at the EXISTING Flyway migration directory, apps/portfolio-b/db/migration/
    # (Architect-owned, ADR-098 Decision 1) — sqlc reads it
    # directly as the schema source of truth. Never copy this schema into backend-go; Phase 0
    # confirmed (db/migration_test.go) it applies cleanly through the same Flyway CLI image used
    # in prod.
    # Explicit ordered file list, NOT a directory string — see backend-go/hack/
    # gen-sqlc-schema-list.sh at the repo root. sqlc reads a directory schema in
    # lexicographic filename order (documented sqlc limitation), which can misorder
    # Flyway's unpadded V-numbering once a directory crosses 9 files. Re-run that script
    # (pointed at this directory) and paste its output here whenever a new Flyway
    # migration file is added to this directory.
    schema:
      - "../db/migration/V1__baseline_schema.sql"
      - "../db/migration/V2__default_reference_data.sql"
    # No domain queries exist yet — this app's own migration phase (Phase 6) adds the first ones.
    queries: "db/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "db/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
